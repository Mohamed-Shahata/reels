services:
  postgres:
    image: postgres:16-alpine
    container_name: podcast-reels-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: podcast
      POSTGRES_PASSWORD: podcast
      POSTGRES_DB: podcast_reels
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U podcast -d podcast_reels']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
